<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas 2D Renderer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #000;
            overflow: hidden;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <!-- The canvas element will be configured by the animation logic or the renderer -->
    <canvas id="stage" width="1920" height="1080"></canvas>
    
    <img id="portrait" src="asset/1756387223128.jpg" style="display:none;" crossorigin="anonymous" />
    <script src="timeline.js"></script>
    <script>
        // Load fonts and images before animation starts
        window.assetsReady = false;
        async function loadAssets() {
            try {
                const font = new FontFace('Geist', 'url(GeistVF.woff2)', { weight: '100 900' });
                await font.load();
                document.fonts.add(font);
                console.log('Geist font loaded');
                
                const img = document.getElementById('portrait');
                if (!img.complete) {
                    await new Promise(r => { img.onload = r; img.onerror = r; });
                }
                
                window.assetsReady = true;
            } catch (err) {
                console.error('Asset loading error:', err);
                window.assetsReady = true; // Fallback
            }
        }
        loadAssets();
    </script>

    <!-- Load the animation logic -->
    <script type="module" src="src/animation.js"></script>
</body>
</html>
